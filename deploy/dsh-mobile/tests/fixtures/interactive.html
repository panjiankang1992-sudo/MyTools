<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interactive preview sample</title><style>body{font:16px system-ui;background:#f1faf5;color:#153e38;padding:16px}button{min-height:44px;padding:10px 18px;font:inherit}output{display:block;margin-top:16px}</style><h1>Interactive HTML</h1><p>Synthetic counter. No network requests.</p><button id="increment">Add one</button><output id="count" aria-live="polite">Count: 0</output><script>let count=0;document.querySelector('#increment').onclick=()=>{document.querySelector('#count').textContent='Count: '+(++count);};</script></html>
