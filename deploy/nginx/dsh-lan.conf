# DSH通过Ubuntu局域网地址直连，App公网入口由Cloudflare Tunnel回源到本机监听地址。
server {
    listen 127.0.0.1:3081;
    listen 192.168.1.7:3081;
    listen 192.168.3.159:3081;
    server_name dsh-app.yuyutian.top 192.168.1.7 192.168.3.159;

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        # 部分HarmonyOS真机ArkWeb缺少randomUUID，同时窄屏需要隐藏侧栏并压缩会话操作区。
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter '</head>' '<script>(function(){if(typeof crypto.randomUUID!=="function"){crypto.randomUUID=function(){var b=new Uint8Array(16);crypto.getRandomValues(b);b[6]=(b[6]&15)|64;b[8]=(b[8]&63)|128;var h=Array.prototype.map.call(b,function(v){return v.toString(16).padStart(2,"0")}).join("");return h.slice(0,8)+"-"+h.slice(8,12)+"-"+h.slice(12,16)+"-"+h.slice(16,20)+"-"+h.slice(20)}}function c(){var r=document.querySelector(".hHd-Xa_root");if(!r)return false;if(!r.classList.contains("hHd-Xa_collapsed")){var t=r.querySelector(".hHd-Xa_toggle");if(t)t.click()}return true}window.addEventListener("DOMContentLoaded",function(){if(c())return;var o=new MutationObserver(function(){if(c())o.disconnect()});o.observe(document.documentElement,{childList:true,subtree:true})})})();</script><style>html,body,#root{width:100%;max-width:100%;height:100%;overflow:hidden}html{-webkit-text-size-adjust:100%}@media(max-width:600px){html{-webkit-text-size-adjust:90%;text-size-adjust:90%}.wSkVaW_root *{box-sizing:border-box;min-width:0}.pI_x6G_frame{grid-template-columns:0 minmax(0,1fr) 0!important}.pI_x6G_sidebarCol{overflow:visible;width:0!important;min-width:0!important}.pI_x6G_sidebarCol:has(.hHd-Xa_root:not(.hHd-Xa_collapsed)){position:fixed;z-index:30;top:0;bottom:0;left:0;width:min(82vw,320px)!important;box-shadow:12px 0 28px rgba(0,0,0,.18)}.hHd-Xa_root.hHd-Xa_collapsed{position:fixed;z-index:31;top:8px;left:8px;width:40px!important;height:40px!important;padding:0!important;overflow:visible;background:transparent!important}.hHd-Xa_collapsed .hHd-Xa_logoRow{width:40px;height:40px;margin:0!important}.hHd-Xa_collapsed .hHd-Xa_toggle{width:40px!important;height:40px!important;min-width:40px!important;padding:0!important;border-radius:12px;background:rgba(255,255,255,.94);box-shadow:0 2px 10px rgba(0,0,0,.14)}.hHd-Xa_collapsed .hHd-Xa_newSession,.hHd-Xa_collapsed .hHd-Xa_regionArea,.hHd-Xa_collapsed .hHd-Xa_footArea{display:none!important}.hHd-Xa_collapsed .hHd-Xa_toggle .hHd-Xa_panelIcon{display:inline!important}.hHd-Xa_collapsed .hHd-Xa_toggle .hHd-Xa_railFish{display:none!important}.pXSMma_headline{font-size:22px;line-height:28px}.uV2eYG_card{font-size:14px;line-height:21px}.wSkVaW_header{padding-left:56px!important;padding-right:8px}.wSkVaW_headerUtilities{margin-left:4px}.Md3f7G_scroll{padding-left:10px;padding-right:10px;font-size:14px}.p-xYUq_actions{max-width:100%;gap:5px;overflow:hidden}.p-xYUq_action{flex:none;min-width:26px}.p-xYUq_timeStart,.p-xYUq_timeEnd{min-width:0;text-overflow:ellipsis;overflow:hidden}.p-xYUq_timeStart{padding-right:5px}.p-xYUq_timeEnd{padding-left:5px}.uV2eYG_root{padding-left:6px;padding-right:6px}.uV2eYG_card{gap:6px}.uV2eYG_row{gap:4px;padding-left:5px;padding-right:5px}.uV2eYG_tools{flex:0 1 auto;gap:3px}.uV2eYG_modes{flex:none;gap:2px;overflow:visible}.uV2eYG_add{flex:none;min-width:26px}._7KE1Ra_root{flex:0 1 128px;width:128px;max-width:128px;overflow:visible}._7KE1Ra_trigger{width:100%;max-width:128px;min-height:32px;padding-left:5px;padding-right:2px;font-size:11px;line-height:16px;gap:2px}._7KE1Ra_triggerEffort{font-size:10px}.Sh0Q9G_trigger{max-width:48px;min-height:32px;padding-left:4px;padding-right:2px;font-size:11px;gap:2px}.uV2eYG_trailing{margin-left:auto;gap:3px}.JObwrW_trigger{width:26px;height:26px}.uV2eYG_select{width:48px;max-width:48px;padding-left:3px;padding-right:16px;font-size:11px}.wSkVaW_heroWorkspaceRow{padding-left:6px}}</style></head>';
        proxy_set_header Host $http_host;
        proxy_set_header Origin $scheme://$http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
