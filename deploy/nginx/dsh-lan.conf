# DSH通过Ubuntu局域网地址直连，App公网入口由Cloudflare Tunnel回源到本机监听地址。
map "$request_method:$uri" $mytools_dsh_prompt_transport_log {
    default 0;
    "POST:/api/session/prompt" 1;
}

# 诊断发送链路中断时只记录时间、状态和字节数，不记录正文及凭据。
log_format mytools_dsh_prompt_transport
    'end=$msec status=$status upstream=$upstream_status received=$request_length expected=$content_length '
    'elapsed=$request_time upstream_header=$upstream_header_time response=$body_bytes_sent';

server {
    listen 127.0.0.1:3081;
    listen 192.168.1.7:3081;
    listen 192.168.3.159:3081;
    server_name dsh-app.yuyutian.top 192.168.1.7 192.168.3.159;

    # HTML 注入要求上游返回原文，传给手机前再压缩脚本和样式以减少弱网加载时间。
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/javascript application/javascript text/css application/json application/manifest+json image/svg+xml;

    # 票据只消费一次，避免进入访问日志或 Referer。
    location = /_mytools/connect {
        access_log off;
        proxy_pass http://127.0.0.1:23200/internal/dsh-web/connect;
        proxy_set_header Host $host;
    }
    location = /_mytools/auth {
        internal;
        # 鉴权子请求仍检查原请求长度，采用同一上限但不转发请求体。
        client_max_body_size 300m;
        proxy_pass http://127.0.0.1:23200/internal/dsh-web/authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        include /etc/nginx/snippets/mytools-dsh-auth-secret.conf;
        proxy_set_header Cookie $http_cookie;
    }
    # 只检查现有网页会话，客户端据此提示重新换票。
    location = /_mytools/session-status {
        if ($request_method != GET) { return 405; }
        if ($http_sec_fetch_site = cross-site) { return 403; }
        auth_request /_mytools/auth;
        add_header Cache-Control "no-store" always;
        try_files /.__mytools_dsh_session_status =204;
    }
    # 适配资源不含业务数据或凭据，版本参数用于更新客户端缓存。
    location = /_mytools/mobile.css {
        alias /var/www/mytools-dsh-mobile/mobile.css;
        default_type text/css;
        add_header Cache-Control "no-cache";
    }
    location = /_mytools/mobile.js {
        alias /var/www/mytools-dsh-mobile/mobile.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }
    location = /_mytools/upload.js {
        alias /var/www/mytools-dsh-mobile/upload.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }
    # 公网中继只接受已通过 DSH 网页会话验证的分片请求。
    location ^~ /_mytools/upload/ {
        access_log off;
        if ($http_sec_fetch_site = cross-site) { return 403; }
        if ($http_origin !~ "^(https://dsh-app\.yuyutian\.top)?$") { return 403; }
        if ($args != "") { return 400; }
        if ($uri !~ "^/_mytools/upload/(status|part|commit)$") { return 404; }
        auth_request /_mytools/auth;
        auth_request_set $mytools_dsh_upload_upstream $upstream_http_x_dsh_upstream_cookie;
        client_max_body_size 256k;
        proxy_pass http://unix:/run/mytools-dsh-upload.sock;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_next_upstream off;
        proxy_cache off;
        proxy_intercept_errors off;
        # 只传固定协议字段，防止客户端覆盖鉴权生成的上游凭据。
        proxy_pass_request_headers off;
        proxy_set_header Host mytools-dsh-upload;
        proxy_set_header Connection close;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-MyTools-Dsh-Upstream $mytools_dsh_upload_upstream;
        proxy_set_header X-Dsh-Upload-Id $http_x_dsh_upload_id;
        proxy_set_header X-Dsh-Upload-Size $http_x_dsh_upload_size;
        proxy_set_header X-Dsh-Upload-Index $http_x_dsh_upload_index;
        proxy_set_header X-Dsh-Upload-Target $http_x_dsh_upload_target;
        proxy_set_header X-Dsh-Upload-Query $http_x_dsh_upload_query;
        proxy_hide_header Set-Cookie;
        proxy_hide_header X-MyTools-Dsh-Upstream;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }
    location / {
        access_log /var/log/nginx/access.log combined;
        access_log /var/log/nginx/mytools-dsh-prompt-transport.log mytools_dsh_prompt_transport if=$mytools_dsh_prompt_transport_log;
        # 保留 DSH 自身认证，代理额外验证当前 MyTools 账号。
        if ($http_sec_fetch_site = cross-site) { return 403; }
        if ($http_origin !~ "^(https://dsh-app\.yuyutian\.top)?$") { return 403; }
        auth_request /_mytools/auth;
        auth_request_set $dsh_upstream_cookie $upstream_http_x_dsh_upstream_cookie;
        proxy_set_header Cookie $dsh_upstream_cookie;
        proxy_hide_header Set-Cookie;
        # 不把浏览器输入的 token 参数转交上游生成独立认证 Cookie。
        if ($arg_token != "") { return 403; }
        # DSH 接收流式文件和带图片的 JSON，请求上限与当前 DSH Web 保持一致。
        client_max_body_size 300m;
        client_body_timeout 120s;
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        # 提供 ArkWeb 兼容和手机布局资源，覆盖登录、设置与全局页面。
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        # 插件组合包按 rev 缓存一年；DSH 升级后 rev 可能不变，旧包会一直命中缓存。
        # 这里给每个组合包追加部署版本，升级 DSH 后把 mytools 参数加一即可强制重新取包。
        sub_filter 'client.js&rev=' 'client.js&mytools=20261126a&rev=';
        sub_filter 'client.js&amp;rev=' 'client.js&amp;mytools=20261126a&amp;rev=';
        include /etc/nginx/snippets/mytools-dsh-upload-head.conf;
        sub_filter '</head>' '<link rel="stylesheet" href="/_mytools/mobile.css?v=20261123b"><script src="/_mytools/mobile.js?v=20261123b"></script></head>';
        proxy_set_header Host dsh-app.yuyutian.top;
        proxy_set_header Origin https://dsh-app.yuyutian.top;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
