name: image_generate
version: 1.0.0
runtime: python3.12
entrypoint: scripts/main.py
capabilities:
  - filesystem_read
  - filesystem_write
  - http_comfyui
parameters:
  required: [jobId, resourceId, prompt, mode, references, size, count, seed, workflowRevision]
result:
  schema: schemas/result.schema.json
limits:
  timeoutSeconds: 2700
  maxInputBytes: 10485760
