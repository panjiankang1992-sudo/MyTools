server:
  address: ${ASSET_REGISTRY_HTTP_HOST:127.0.0.1}
  port: ${ASSET_REGISTRY_HTTP_PORT:23270}
spring:
  application:
    name: asset-registry-service
  datasource:
    url: jdbc:mysql://${ASSET_DB_HOST:127.0.0.1}:${ASSET_DB_PORT:3306}/${ASSET_DB_NAME:mytools_asset}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${ASSET_DB_USER:}
    password: ${ASSET_DB_PASSWORD:}
  flyway:
    locations: classpath:db/migration
management:
  endpoints:
    web:
      exposure:
        include: health,info
asset-registry:
  internal-token: ${ASSET_REGISTRY_INTERNAL_TOKEN:}
