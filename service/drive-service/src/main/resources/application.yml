server:
  address: ${DRIVE_HTTP_HOST:127.0.0.1}
  port: ${DRIVE_HTTP_PORT:23280}
spring:
  application:
    name: drive-service
  datasource:
    url: jdbc:mysql://${DRIVE_DB_HOST:127.0.0.1}:${DRIVE_DB_PORT:3306}/${DRIVE_DB_NAME:mytools_drive}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DRIVE_DB_USER:}
    password: ${DRIVE_DB_PASSWORD:}
  flyway:
    locations: classpath:db/migration
management.endpoints.web.exposure.include: health,info
drive:
  internal-token: ${DRIVE_INTERNAL_TOKEN:}
  rclone-rc-url: ${DRIVE_RCLONE_RC_URL:http://127.0.0.1:5572}
  rclone-rc-user: ${DRIVE_RCLONE_RC_USER:}
  rclone-rc-password: ${DRIVE_RCLONE_RC_PASSWORD:}
  storage-scan-mode: ${DRIVE_STORAGE_SCAN_MODE:LEGACY}
  storage-gateway-url: ${STORAGE_GATEWAY_URL:http://127.0.0.1:23240}
  storage-internal-token: ${STORAGE_INTERNAL_TOKEN:}
