services:
  napcat:
    image: mlikiowa/napcat-docker@sha256:02ddf329894887552bc6207a41e471bcf51ef0f04751804905aeb8cf1f737d4f
    container_name: downloadbot-napcat
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: 256m
    env_file:
      - path: /opt/napcat/login.env
        required: false
    environment:
      ACCOUNT: ${ACCOUNT:?ACCOUNT is required}
      NAPCAT_UID: ${NAPCAT_UID:-1000}
      NAPCAT_GID: ${NAPCAT_GID:-1000}
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3001:3001"
      - "127.0.0.1:6099:6099"
    volumes:
      - /opt/napcat/qq:/app/.config/QQ
      - /opt/napcat/config:/app/napcat/config
      - /opt/napcat/cache:/app/napcat/cache
      - /opt/napcat/plugins:/app/napcat/plugins
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "10"
