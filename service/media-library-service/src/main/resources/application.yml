server:
  address: ${MEDIA_LIBRARY_HTTP_HOST:127.0.0.1}
  port: ${MEDIA_LIBRARY_HTTP_PORT:23300}
spring:
  application.name: media-library-service
  datasource:
    url: jdbc:mysql://${MEDIA_LIBRARY_DB_HOST:127.0.0.1}:${MEDIA_LIBRARY_DB_PORT:3306}/${MEDIA_LIBRARY_DB_NAME:mytools_media}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MEDIA_LIBRARY_DB_USER:}
    password: ${MEDIA_LIBRARY_DB_PASSWORD:}
  flyway.locations: classpath:db/migration
management.endpoints.web.exposure.include: health,info
media-library.internal-token: ${MEDIA_LIBRARY_INTERNAL_TOKEN:}
media-library.task-scheduler-url: ${TASK_SCHEDULER_URL:http://127.0.0.1:23410}
media-library.legacy-db-host: ${MYTOOLS_LEGACY_DB_HOST:127.0.0.1}
media-library.legacy-db-port: ${MYTOOLS_LEGACY_DB_PORT:3306}
media-library.legacy-db-name: ${MYTOOLS_LEGACY_DB_NAME:mytools}
media-library.legacy-db-user: ${MYTOOLS_LEGACY_DB_USER:}
media-library.legacy-db-password: ${MYTOOLS_LEGACY_DB_PASSWORD:}
