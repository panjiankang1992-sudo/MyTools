name: media_scan_directory
version: 1.0.0
runtime: python3.12
entrypoint: scripts/main.py
capabilities:
  - filesystem_read
  - network_internal
  - task_control
parameters:
  required:
    - rootPath
    - directoryKey
    - directoryName
    - ownerId
result:
  schema: schemas/result.schema.json
limits:
  timeoutSeconds: 7200
  maxOutputBytes: 1048576
