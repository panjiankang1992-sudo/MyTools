name: media_publish_scanned_file
version: 1.0.0
runtime: python3.12
entrypoint: scripts/main.py
capabilities:
  - filesystem_read
  - network_http
parameters:
  required:
    - sourcePath
    - sourceBusinessId
    - contentSha256
    - sizeBytes
result:
  schema: schemas/result.schema.json
limits:
  timeoutSeconds: 3600
  maxOutputBytes: 1048576
