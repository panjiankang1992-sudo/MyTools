name: reader_extract_audiobook_text
version: 1.0.0
runtime: python3.12
entrypoint: scripts/main.py
capabilities:
  - storage_gateway_read
  - storage_gateway_upload
  - reader_internal_read
  - reader_internal_write
parameters:
  required:
    - generationId
    - ownerId
    - storageRoot
result:
  schema: schemas/result.schema.json
limits:
  timeoutSeconds: 7200
  maxInputBytes: 536870912
  maxChapterBytes: 10485760
  maxChapters: 20000
