name: reader_analyze_audiobook_book
version: 1.0.0
runtime: python3.12
entrypoint: scripts/main.py
capabilities:
  - storage_gateway_read
  - reader_internal_read
  - reader_internal_write
  - audiobook_analysis_llm
  - audiobook_analysis_ner
parameters:
  required:
    - generationId
    - ownerId
    - storageRoot
result:
  schema: schemas/result.schema.json
limits:
  timeoutSeconds: 21600
  maxBookBytes: 52428800
  maxChapterBytes: 10485760
  maxPromptCharacters: 12000
  maxChapters: 20000
