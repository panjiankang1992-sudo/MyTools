# 临时客户端诊断入口；在原新闻 server 内单独 include，不修改正式订阅内容。
location = /news/rss/outlook-check.xml {
    alias /var/lib/mytools-news-diagnostics/20261104/minimal.xml;
    default_type application/rss+xml;
    types { application/rss+xml xml; }
    charset utf-8;
    gzip off;
    etag off;
    if_modified_since off;
    # 强制经过源站并记录真实客户端请求，避免缓存命中导致无法关联失败。
    add_header Cache-Control "no-store, no-transform" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-MyTools-RSS-Check minimal always;
    access_log /var/log/nginx/mytools-news-rss-check.log combined;
    limit_except GET HEAD { deny all; }
}

location = /news/rss/outlook-full-check.xml {
    # 与正式订阅逐字节一致，发布指针切换后自动跟随最新内容。
    alias /var/lib/mytools-news-public/current/rss/outlook.xml;
    default_type application/rss+xml;
    types { application/rss+xml xml; }
    charset utf-8;
    gzip off;
    etag off;
    if_modified_since off;
    add_header Cache-Control "no-store, no-transform" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-MyTools-RSS-Check full always;
    access_log /var/log/nginx/mytools-news-rss-check.log combined;
    limit_except GET HEAD { deny all; }
}
