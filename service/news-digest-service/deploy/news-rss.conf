# 在既有 HTTPS 入口对应的 server 内 include；发布目录与内部材料分离。
location = /news {
    return 301 /news/subscribe/;
}
location = /news/ {
    return 301 /news/subscribe/;
}
# 经典 Outlook 使用已通过实机验证的完整响应，避免复用旧缓存或条件响应。
location = /news/rss/outlook.xml {
    alias /var/lib/mytools-news-public/current/rss/outlook.xml;
    default_type application/rss+xml;
    types { application/rss+xml xml; }
    charset utf-8;
    gzip off;
    etag off;
    if_modified_since off;
    add_header Cache-Control "no-store, no-transform" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'" always;
    access_log /var/log/nginx/mytools-news-rss-outlook.log combined;
    limit_except GET HEAD { deny all; }
}
location ^~ /news/ {
    alias /var/lib/mytools-news-public/current/;
    autoindex off;
    index index.html;
    etag on;
    if_modified_since exact;
    charset utf-8;
    # RSS 压缩需显式声明 MIME；兼容不支持压缩的客户端仍返回原文。
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/rss+xml text/x-opml;
    types {
        text/html html;
        application/rss+xml xml;
        text/x-opml opml;
        image/png png;
        image/jpeg jpg;
        image/gif gif;
    }
    default_type application/octet-stream;
    # 只提供显式公开文件，元数据即使误放入目录也无法下载。
    if ($uri !~ "^/news/(subscribe/(index\.html)?|rss/(daily|outlook|tech|world|domestic|trending|military|finance|society|sports|entertainment|local/[a-z0-9-]+)\.xml|rss/categories\.opml|editions/[0-9-]+/(r[0-9]+/)?(daily|tech|world|domestic|trending|military|finance|society|sports|entertainment|local/[a-z0-9-]+)\.html|articles/[a-f0-9]{64}/(r[0-9]+|index)\.html|assets/[a-f0-9]{64}\.(png|jpg|gif))$") {
        return 404;
    }
    add_header Cache-Control "public, max-age=300";
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'" always;
    limit_except GET HEAD { deny all; }
}
