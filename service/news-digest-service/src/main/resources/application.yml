server:
  address: ${NEWS_HTTP_HOST:127.0.0.1}
  port: ${NEWS_HTTP_PORT:23350}
  tomcat.max-http-form-post-size: 2MB
spring:
  application.name: news-digest-service
  task.scheduling.pool.size: 4
  datasource:
    url: jdbc:mysql://${NEWS_DB_HOST:127.0.0.1}:${NEWS_DB_PORT:3306}/${NEWS_DB_NAME:mytools_news}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    hikari.connection-timeout: ${NEWS_DB_CONNECTION_TIMEOUT_MS:3000}
    username: ${NEWS_DB_USER:}
    password: ${NEWS_DB_PASSWORD:}
  flyway.locations: classpath:db/migration
  jackson.deserialization.fail-on-unknown-properties: true
management.endpoints.web.exposure.include: health,info,prometheus
management.endpoint.health.show-details: never
management.metrics.tags.application: ${spring.application.name}
news:
  registry-capacity:
    sources: ${NEWS_CAPACITY_SOURCES:1000}
    source-packs: ${NEWS_CAPACITY_SOURCE_PACKS:10000}
    region-nodes: ${NEWS_CAPACITY_REGION_NODES:1000}
    region-jobs: ${NEWS_CAPACITY_REGION_JOBS:100000}
    direct-observations: ${NEWS_CAPACITY_DIRECT_OBSERVATIONS:10000}
  control-capacity:
    subscriptions: ${NEWS_CAPACITY_SUBSCRIPTIONS:1000}
    target-owners: ${NEWS_CAPACITY_TARGET_OWNERS:1000}
    daily-runs: ${NEWS_CAPACITY_DAILY_RUNS:100000}
    preview-identities: ${NEWS_CAPACITY_PREVIEW_IDENTITIES:100000}
  collection-capacity:
    article-rows: ${NEWS_CAPACITY_ARTICLE_ROWS:250000}
    snapshot-rows: ${NEWS_CAPACITY_SNAPSHOT_ROWS:250000}
    withdrawal-rows: ${NEWS_CAPACITY_WITHDRAWAL_ROWS:100000}
    payload-bytes: ${NEWS_CAPACITY_PAYLOAD_BYTES:536870912}
  retention:
    enabled: ${NEWS_RETENTION_ENABLED:false}
    timer-enabled: ${NEWS_RETENTION_TIMER_ENABLED:true}
    evidence-hours: ${NEWS_EVIDENCE_RETENTION_HOURS:168}
    metadata-days: ${NEWS_METADATA_RETENTION_DAYS:90}
    edition-days: ${NEWS_EDITION_RETENTION_DAYS:180}
    delivery-days: ${NEWS_DELIVERY_RETENTION_DAYS:90}
    batch-size: ${NEWS_RETENTION_BATCH_SIZE:250}
  delivery:
    enabled: ${NEWS_DELIVERY_ENABLED:false}
    timer-enabled: ${NEWS_DELIVERY_TIMER_ENABLED:true}
    messaging-url: ${MESSAGING_SERVICE_URL:http://127.0.0.1:23250}
    messaging-token: ${MESSAGING_OUTBOUND_CLIENT_TOKEN:}
    reader-url: ${NEWS_READER_URL:}
  internal-token: ${NEWS_INTERNAL_TOKEN:}
  admin-token: ${NEWS_ADMIN_TOKEN:}
  collection-enabled: ${NEWS_COLLECTION_ENABLED:false}
  zone: ${NEWS_ZONE:Asia/Shanghai}
  cutoff-time: ${NEWS_CUTOFF_TIME:07:30}
  pipeline:
    enabled: ${NEWS_PIPELINE_ENABLED:false}
    timer-enabled: ${NEWS_PIPELINE_TIMER_ENABLED:true}
    rss-interval-minutes: ${NEWS_RSS_INTERVAL_MINUTES:30}
  weekly:
    enabled: ${NEWS_WEEKLY_ENABLED:false}
    timer-enabled: ${NEWS_WEEKLY_TIMER_ENABLED:true}
    asset-directory: ${NEWS_WEEKLY_ASSET_DIRECTORY:/var/lib/mytools-news-weekly/assets}
  scheduling:
    enabled: ${NEWS_SCHEDULING_ENABLED:false}
    timer-enabled: ${NEWS_SCHEDULING_TIMER_ENABLED:true}
    scheduler-url: ${NEWS_SCHEDULER_URL:http://127.0.0.1:23410}
    business-token: ${TASK_BUSINESS_NEWS_TOKEN:}
    worker-token: ${NEWS_JOB_TOKEN:}
  region:
    node-id: ${NEWS_REGION_NODE_ID:}
    report-token: ${NEWS_REGION_REPORT_TOKEN:}
    maximum-city-radius-km: ${NEWS_REGION_MAXIMUM_CITY_RADIUS_KM:50}
    allow-province-fallback: ${NEWS_REGION_ALLOW_PROVINCE_FALLBACK:true}
  tech:
    github-token: ${NEWS_GITHUB_TOKEN:}
    item-limit: ${NEWS_TECH_ITEM_LIMIT:30}
    detail-limit: ${NEWS_TECH_DETAIL_LIMIT:10}
    tracked-limit: ${NEWS_GITHUB_TRACKED_LIMIT:30}
