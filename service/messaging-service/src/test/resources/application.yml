spring:
  datasource:
    url: jdbc:h2:mem:messaging;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    locations: classpath:db/migration
  mail:
    host: localhost
    port: 2525

messaging:
  scheduler-url: http://127.0.0.1:23210
  internal-token: test-messaging-token
  mail-from: sender@example.com
  automation-url: http://automation.test
  automation-token: test-automation-token
  automation-relay-enabled: false
  automation-relay-batch-size: 50
  one-bot-ingress-enabled: true
  download-ingestion-url: http://download.test
  download-ingestion-token: test-download-token

management:
  health:
    mail:
      enabled: false
