server:
  address: ${MESSAGING_HTTP_HOST:127.0.0.1}
  port: ${MESSAGING_HTTP_PORT:23250}

spring:
  application:
    name: messaging-service
  datasource:
    url: jdbc:mysql://${MESSAGING_DB_HOST:127.0.0.1}:${MESSAGING_DB_PORT:3306}/${MESSAGING_DB_NAME:mytools_messaging}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MESSAGING_DB_USER:}
    password: ${MESSAGING_DB_PASSWORD:}
  flyway:
    locations: classpath:db/migration
  mail:
    host: ${MESSAGING_SMTP_HOST:}
    port: ${MESSAGING_SMTP_PORT:465}
    username: ${MESSAGING_SMTP_USERNAME:}
    password: ${MESSAGING_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${MESSAGING_SMTP_AUTH:true}
      mail.smtp.ssl.enable: ${MESSAGING_SMTP_SSL:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info

messaging:
  scheduler-url: ${TASK_SCHEDULER_URL:http://127.0.0.1:23210}
  internal-token: ${MESSAGING_INTERNAL_TOKEN:}
  mail-from: ${MESSAGING_MAIL_FROM:}
  automation-url: ${MESSAGE_AUTOMATION_URL:http://127.0.0.1:23260}
  automation-token: ${MESSAGE_AUTOMATION_INTERNAL_TOKEN:}
  automation-relay-enabled: ${MESSAGE_AUTOMATION_RELAY_ENABLED:false}
  automation-relay-batch-size: ${MESSAGE_AUTOMATION_RELAY_BATCH_SIZE:50}
  one-bot-ingress-enabled: ${MESSAGING_ONEBOT_INGRESS_ENABLED:false}
  download-ingestion-url: ${DOWNLOAD_INGESTION_URL:http://127.0.0.1:23220}
  download-ingestion-token: ${DOWNLOAD_INTERNAL_TOKEN:}
  provider-resolver-url: ${MESSAGE_PROVIDER_RESOLVER_URL:http://127.0.0.1:23255}
  provider-resolver-token: ${MESSAGE_PROVIDER_RESOLVER_TOKEN:}
  email-ingress:
    enabled: ${MESSAGING_EMAIL_INGRESS_ENABLED:false}
    owner-id: ${MESSAGING_EMAIL_OWNER_ID:0}
    account-key: ${MESSAGING_EMAIL_ACCOUNT_KEY:default_email}
    host: ${MESSAGING_IMAP_HOST:}
    port: ${MESSAGING_IMAP_PORT:993}
    ssl: ${MESSAGING_IMAP_SSL:true}
    username: ${MESSAGING_IMAP_USERNAME:}
    password: ${MESSAGING_IMAP_PASSWORD:}
    mailbox: ${MESSAGING_IMAP_MAILBOX:INBOX}
    batch-size: ${MESSAGING_IMAP_BATCH_SIZE:50}
    maximum-message-bytes: ${MESSAGING_IMAP_MAXIMUM_MESSAGE_BYTES:26214400}
