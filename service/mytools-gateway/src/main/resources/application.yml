server:
  address: ${GATEWAY_HTTP_HOST:127.0.0.1}
  port: ${GATEWAY_HTTP_PORT:23200}

spring:
  application:
    name: mytools-gateway
  jackson:
    deserialization:
      fail-on-unknown-properties: true

gateway:
  identity-mode: ${IDENTITY_VALIDATION_MODE:LEGACY}
  identity-route-enabled: ${GATEWAY_IDENTITY_ROUTE_ENABLED:false}
  reader-route-enabled: ${GATEWAY_READER_ROUTE_ENABLED:false}
  reader-tenant-allowlist: ${GATEWAY_READER_TENANT_ALLOWLIST:}
  drive-route-enabled: ${GATEWAY_DRIVE_ROUTE_ENABLED:false}
  drive-tenant-allowlist: ${GATEWAY_DRIVE_TENANT_ALLOWLIST:}
  download-route-enabled: ${GATEWAY_DOWNLOAD_ROUTE_ENABLED:false}
  download-tenant-allowlist: ${GATEWAY_DOWNLOAD_TENANT_ALLOWLIST:}
  media-route-enabled: ${GATEWAY_MEDIA_ROUTE_ENABLED:false}
  messaging-route-enabled: ${GATEWAY_MESSAGING_ROUTE_ENABLED:false}
  app-catalog:
    route-enabled: ${GATEWAY_APP_CATALOG_ROUTE_ENABLED:false}
    url: ${APP_CATALOG_SERVICE_URL:http://127.0.0.1:23310}
    token: ${APP_CATALOG_INTERNAL_TOKEN:}
  dsh:
    route-enabled: ${GATEWAY_DSH_ROUTE_ENABLED:false}
    url: ${DSH_CONNECTOR_SERVICE_URL:http://127.0.0.1:23320}
    token: ${DSH_CONNECTOR_INTERNAL_TOKEN:}
  mytools-url: ${MYTOOLS_INTERNAL_URL:http://127.0.0.1:23110}
  identity-url: ${IDENTITY_SERVICE_URL:http://127.0.0.1:23290}
  reader-url: ${READER_SERVICE_URL:http://127.0.0.1:23230}
  drive-url: ${DRIVE_SERVICE_URL:http://127.0.0.1:23280}
  download-url: ${DOWNLOAD_INGESTION_URL:http://127.0.0.1:23220}
  media-url: ${MEDIA_LIBRARY_URL:http://127.0.0.1:23300}
  messaging-url: ${MESSAGING_SERVICE_URL:http://127.0.0.1:23250}
  internal-token: ${GATEWAY_INTERNAL_TOKEN:}
  identity-token: ${IDENTITY_INTERNAL_TOKEN:}
  reader-token: ${READER_INTERNAL_TOKEN:}
  drive-token: ${DRIVE_INTERNAL_TOKEN:}
  download-token: ${DOWNLOAD_INGESTION_TOKEN:}
  media-token: ${MEDIA_LIBRARY_INTERNAL_TOKEN:}
  messaging-token: ${MESSAGING_INTERNAL_TOKEN:}
  connect-timeout-millis: ${GATEWAY_CONNECT_TIMEOUT_MILLIS:1000}
  read-timeout-millis: ${GATEWAY_READ_TIMEOUT_MILLIS:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
