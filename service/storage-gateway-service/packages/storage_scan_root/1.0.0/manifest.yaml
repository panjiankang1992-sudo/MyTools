name: storage_scan_root
version: 1.0.0
runtime: python3.12
entrypoint: scripts/main.py
capabilities:
  - network_http
parameters:
  required:
    - operationId
    - providerId
    - rootPath
    - maximumObjects
result:
  schema: schemas/result.schema.json
limits:
  timeoutSeconds: 3600
  maxOutputBytes: 65536
