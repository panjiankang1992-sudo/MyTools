server:
  address: ${STORAGE_HTTP_HOST:127.0.0.1}
  port: ${STORAGE_HTTP_PORT:23240}

spring:
  application:
    name: storage-gateway-service
  datasource:
    url: jdbc:mysql://${STORAGE_DB_HOST:127.0.0.1}:${STORAGE_DB_PORT:3306}/${STORAGE_DB_NAME:mytools_storage}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${STORAGE_DB_USER:}
    password: ${STORAGE_DB_PASSWORD:}
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      enabled: false

storage:
  internal-token: ${STORAGE_INTERNAL_TOKEN:}
  default-root-name: ${STORAGE_DEFAULT_ROOT_NAME:managed}
  default-root-purpose: ${STORAGE_DEFAULT_ROOT_PURPOSE:GENERAL}
  default-root-path: ${STORAGE_DEFAULT_ROOT_PATH:./runtime/storage}
  default-root-node-label: ${STORAGE_DEFAULT_ROOT_NODE_LABEL:storage.mount.managed}
  default-root-node-value: ${STORAGE_DEFAULT_ROOT_NODE_VALUE:present}
  maximum-upload-bytes: ${STORAGE_MAXIMUM_UPLOAD_BYTES:536870912}
  native-copy-maximum-bytes: ${STORAGE_NATIVE_COPY_MAXIMUM_BYTES:21474836480}
  rclone-rc-url: ${STORAGE_RCLONE_RC_URL:http://127.0.0.1:5572}
  rclone-rc-user: ${STORAGE_RCLONE_RC_USER:}
  rclone-rc-password: ${STORAGE_RCLONE_RC_PASSWORD:}
  rclone-serve-url: ${STORAGE_RCLONE_SERVE_URL:http://127.0.0.1:5573}
  scheduler-url: ${TASK_SCHEDULER_URL:http://127.0.0.1:23410}

management:
  endpoints:
    web:
      exposure:
        include: health,info
