spring:
  datasource:
    url: jdbc:h2:mem:storage;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    locations: classpath:db/migration

storage:
  internal-token: test-storage-token
  default-root-name: managed
  default-root-purpose: TEST
  default-root-path: ${java.io.tmpdir}/mytools-storage-test
  maximum-upload-bytes: 1048576
