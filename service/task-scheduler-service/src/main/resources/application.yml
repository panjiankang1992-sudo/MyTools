spring:
  application:
    name: task-scheduler-service
  datasource:
    url: ${TASK_DB_URL:jdbc:mysql://127.0.0.1:3306/mytools_task?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${TASK_DB_USERNAME:mytools_task}
    password: ${TASK_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  address: ${TASK_SCHEDULER_HTTP_HOST:127.0.0.1}
  port: ${TASK_SCHEDULER_HTTP_PORT:23410}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
task:
  scheduler:
    cron-scan-delay-ms: ${TASK_CRON_SCAN_DELAY_MS:1000}
    cron-lease-seconds: ${TASK_CRON_LEASE_SECONDS:30}
    cron-max-catch-up: ${TASK_CRON_MAX_CATCH_UP:100}
    deadline-scan-delay-ms: ${TASK_DEADLINE_SCAN_DELAY_MS:1000}
