spring:
  datasource:
    url: jdbc:h2:mem:task_scheduler;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
task:
  scheduler:
    cancellation-scan-delay-ms: 60000
    deadline-scan-delay-ms: 60000
    dispatch:
      queue-timeout-seconds: 300
  security:
    required: false
  node-registration:
    enforce: false
  node-health:
    offline-after-seconds: 60
    scan-delay-ms: 60000
    no-available-alert-seconds: 60
