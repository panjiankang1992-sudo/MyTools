[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mytools-legacy-asset-adapter"
version = "0.1.0"
description = "Read-only MyTools local_file snapshot adapter"
requires-python = ">=3.12"
dependencies = ["PyMySQL>=1.1,<2"]

[project.scripts]
mytools-legacy-asset-adapter = "mytools_legacy_asset_adapter.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
