spring:
  datasource:
    url: jdbc:h2:mem:toolbox;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: true
toolbox:
  public-origin: http://localhost:23120
  public-origins: ""
  catalog-path: ./target/test-content-empty
  session:
    cookie-name: toolbox_guest_local
    cookie-secure: false
    ttl-hours: 24
  events:
    max-batch-size: 50
    max-body-bytes: 32768
  stats:
    enabled: true
    cache-ttl-seconds: 0
    aggregate-interval-ms: 600000
    aggregate-batch-size: 200
    aggregation-enabled: false
    outbox-lease-seconds: 60
  # 管理功能在测试中启用，用于覆盖真实鉴权行为（A02/A03 等服务端断言）。
  # upstream-base-url 指向一个不会被访问的地址：匿名请求在解析会话阶段即返回，不会触达上游。
  admin:
    enabled: true
    upstream-base-url: http://127.0.0.1:1
    internal-token: test-only-token-not-a-real-secret
    session-cookie-name: toolbox_admin_local
    # 明文测试环境不能使用 __Host- 前缀：该前缀要求 Secure，否则浏览器拒收。
    login-cookie-name: toolbox_admin_login_local
    cookie-secure: false
    # 测试专用密钥（Base64 的 32 字节零值），不是生产凭据。
    encryption-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
