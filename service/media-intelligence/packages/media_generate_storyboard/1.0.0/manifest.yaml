name: media_generate_storyboard
version: 1.0.0
runtime: python3.12
entrypoint: scripts/main.py
capabilities:
  - filesystem_read
  - filesystem_write
  - ffmpeg
parameters:
  required:
    - assetId
    - contentSha256
    - sourcePath
result:
  schema: schemas/result.schema.json
limits:
  timeoutSeconds: 180
  maxOutputBytes: 1048576
