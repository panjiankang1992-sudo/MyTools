name: media_generate_thumbnail
version: 1.0.0
runtime: python3.12
entrypoint: scripts/main.py
capabilities:
  - filesystem_read
  - ffmpeg
parameters:
  required:
    - assetId
    - contentSha256
    - sourcePath
  optional:
    - seekSeconds
result:
  schema: schemas/result.schema.json
limits:
  timeoutSeconds: 30
