name: media_describe_video
version: 1.0.0
runtime: python3.12
entrypoint: scripts/main.py
capabilities:
  - filesystem_read
  - network_http
parameters:
  required:
    - assetId
    - contentSha256
  optional:
    - sourcePath
result:
  schema: schemas/result.schema.json
limits:
  timeoutSeconds: 240
  maxOutputBytes: 1048576
