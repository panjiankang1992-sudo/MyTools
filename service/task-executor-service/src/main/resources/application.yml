spring:
  application:
    name: task-executor-service
  task:
    scheduling:
      pool:
        size: ${TASK_EXECUTOR_SCHEDULING_POOL_SIZE:4}
      thread-name-prefix: task-executor-scheduler-
executor:
  node-name: ${TASK_EXECUTOR_NODE_NAME:executor-local}
  scheduler-url: ${TASK_SCHEDULER_URL:http://127.0.0.1:23410}
  internal-token: ${TASK_EXECUTOR_INTERNAL_TOKEN:${TASK_INTERNAL_TOKEN:}}
  work-root: ${TASK_EXECUTOR_WORK_ROOT:./runtime/tasks}
  script-root: ${TASK_EXECUTOR_SCRIPT_ROOT:./scripts}
  python-sdk-root: ${TASK_EXECUTOR_PYTHON_SDK_ROOT:./sdk/python}
  python-executable: ${TASK_EXECUTOR_PYTHON_EXECUTABLE:/usr/bin/python3}
  heartbeat-seconds: ${TASK_EXECUTOR_HEARTBEAT_SECONDS:10}
  poll-seconds: ${TASK_EXECUTOR_POLL_SECONDS:1}
  lease-seconds: ${TASK_EXECUTOR_LEASE_SECONDS:60}
  lease-safety-seconds: ${TASK_EXECUTOR_LEASE_SAFETY_SECONDS:30}
  max-concurrent-tasks: ${TASK_EXECUTOR_MAX_CONCURRENT_TASKS:4}
  successful-work-retention-seconds: ${TASK_EXECUTOR_SUCCESSFUL_WORK_RETENTION_SECONDS:604800}
  log-archive:
    enabled: ${TASK_EXECUTOR_LOG_ARCHIVE_ENABLED:false}
    storage-gateway-url: ${STORAGE_GATEWAY_URL:http://127.0.0.1:23240}
    internal-token: ${STORAGE_INTERNAL_TOKEN:}
    root-name: ${TASK_EXECUTOR_LOG_ARCHIVE_ROOT:default}
    relative-path-prefix: ${TASK_EXECUTOR_LOG_ARCHIVE_PREFIX:task-execution-logs}
  require-package-index: ${TASK_EXECUTOR_REQUIRE_PACKAGE_INDEX:false}
  require-non-root: ${TASK_EXECUTOR_REQUIRE_NON_ROOT:true}
  disk:
    minimum-usable-bytes: ${TASK_EXECUTOR_DISK_MINIMUM_USABLE_BYTES:1073741824}
    minimum-usable-percent: ${TASK_EXECUTOR_DISK_MINIMUM_USABLE_PERCENT:5}
  resource-limits:
    maximum-cpu-seconds: ${TASK_EXECUTOR_MAXIMUM_CPU_SECONDS:21600}
    maximum-virtual-memory-bytes: ${TASK_EXECUTOR_MAXIMUM_VIRTUAL_MEMORY_BYTES:17179869184}
    maximum-file-bytes: ${TASK_EXECUTOR_MAXIMUM_FILE_BYTES:107374182400}
  cgroup-v2:
    enabled: ${TASK_EXECUTOR_CGROUP_V2_ENABLED:false}
    root: ${TASK_EXECUTOR_CGROUP_V2_ROOT:/sys/fs/cgroup/mytools-executor}
    maximum-memory-bytes: ${TASK_EXECUTOR_CGROUP_MAXIMUM_MEMORY_BYTES:17179869184}
    maximum-processes: ${TASK_EXECUTOR_CGROUP_MAXIMUM_PROCESSES:256}
    maximum-cpu-percent: ${TASK_EXECUTOR_CGROUP_MAXIMUM_CPU_PERCENT:400}
  network-isolation:
    enabled: ${TASK_EXECUTOR_NETWORK_ISOLATION_ENABLED:false}
    bubblewrap-path: ${TASK_EXECUTOR_BUBBLEWRAP_PATH:/usr/bin/bwrap}
    allowed-domains: {}
  capabilities:
    runtimes:
      - shell
      - python3.12
  labels:
    storage.mount.managed: ${STORAGE_DEFAULT_ROOT_NODE_VALUE:present}
    dsh.connector: ${DSH_CONNECTOR_NODE_VALUE:absent}
    executor.node: ${TASK_EXECUTOR_NODE_NAME:executor-local}
  cluster-names:
    - media
    - reader
    - reader-probe-orchestration
    - download
    - download-orchestration
    - messaging
    - asset
    - drive
    - identity
    - storage
