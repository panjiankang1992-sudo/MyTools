spring:
  application:
    name: task-executor-service
executor:
  node-name: ${TASK_EXECUTOR_NODE_NAME:executor-local}
  scheduler-url: ${TASK_SCHEDULER_URL:http://127.0.0.1:23210}
  work-root: ${TASK_EXECUTOR_WORK_ROOT:./runtime/tasks}
  script-root: ${TASK_EXECUTOR_SCRIPT_ROOT:./scripts}
  python-sdk-root: ${TASK_EXECUTOR_PYTHON_SDK_ROOT:./sdk/python}
  heartbeat-seconds: ${TASK_EXECUTOR_HEARTBEAT_SECONDS:10}
  poll-seconds: ${TASK_EXECUTOR_POLL_SECONDS:1}
  lease-seconds: ${TASK_EXECUTOR_LEASE_SECONDS:60}
  max-concurrent-tasks: ${TASK_EXECUTOR_MAX_CONCURRENT_TASKS:4}
  capabilities:
    runtimes:
      - shell
      - python3.12
  labels: {}
  cluster-names:
    - media
    - reader
    - download
    - messaging
    - asset
  script-environments:
    download_http_asset:
      DOWNLOAD_DESTINATION_ROOT: ${DOWNLOAD_DESTINATION_ROOT:./runtime/downloads}
    media_describe_video:
      MEDIA_DESCRIPTION_BASE_URL: ${MEDIA_DESCRIPTION_BASE_URL:}
      MEDIA_DESCRIPTION_MODEL: ${MEDIA_DESCRIPTION_MODEL:qwen-vl}
      MEDIA_DESCRIPTION_API_KEY: ${MEDIA_DESCRIPTION_API_KEY:}
    reader_source_search:
      READER_RUNTIME_BASE_URL: ${READER_RUNTIME_BASE_URL:http://127.0.0.1:23120}
      READER_RUNTIME_SECURE_KEY: ${READER_RUNTIME_SECURE_KEY:}
    reader_source_discovery:
      READER_SERVICE_URL: ${READER_SERVICE_URL:http://127.0.0.1:23230}
      READER_INTERNAL_TOKEN: ${READER_INTERNAL_TOKEN:}
    reader_source_health_check:
      READER_RUNTIME_BASE_URL: ${READER_RUNTIME_BASE_URL:http://127.0.0.1:23120}
      READER_RUNTIME_SECURE_KEY: ${READER_RUNTIME_SECURE_KEY:}
    reader_import_ebook:
      READER_RUNTIME_BASE_URL: ${READER_RUNTIME_BASE_URL:http://127.0.0.1:23120}
      READER_RUNTIME_SECURE_KEY: ${READER_RUNTIME_SECURE_KEY:}
      STORAGE_GATEWAY_URL: ${STORAGE_GATEWAY_URL:http://127.0.0.1:23240}
      STORAGE_INTERNAL_TOKEN: ${STORAGE_INTERNAL_TOKEN:}
    reader_extract_metadata:
      STORAGE_GATEWAY_URL: ${STORAGE_GATEWAY_URL:http://127.0.0.1:23240}
      STORAGE_INTERNAL_TOKEN: ${STORAGE_INTERNAL_TOKEN:}
    reader_build_catalog:
      STORAGE_GATEWAY_URL: ${STORAGE_GATEWAY_URL:http://127.0.0.1:23240}
      STORAGE_INTERNAL_TOKEN: ${STORAGE_INTERNAL_TOKEN:}
      READER_SERVICE_URL: ${READER_SERVICE_URL:http://127.0.0.1:23230}
      READER_INTERNAL_TOKEN: ${READER_INTERNAL_TOKEN:}
    reader_prefetch_chapters:
      READER_RUNTIME_BASE_URL: ${READER_RUNTIME_BASE_URL:http://127.0.0.1:23120}
      READER_RUNTIME_SECURE_KEY: ${READER_RUNTIME_SECURE_KEY:}
      READER_SERVICE_URL: ${READER_SERVICE_URL:http://127.0.0.1:23230}
      READER_INTERNAL_TOKEN: ${READER_INTERNAL_TOKEN:}
    message_send_email:
      MESSAGING_SERVICE_URL: ${MESSAGING_SERVICE_URL:http://127.0.0.1:23250}
      MESSAGING_INTERNAL_TOKEN: ${MESSAGING_INTERNAL_TOKEN:}
    asset_register_content:
      ASSET_REGISTRY_URL: ${ASSET_REGISTRY_URL:http://127.0.0.1:23270}
      ASSET_REGISTRY_INTERNAL_TOKEN: ${ASSET_REGISTRY_INTERNAL_TOKEN:}
server:
  port: ${TASK_EXECUTOR_MANAGEMENT_PORT:23211}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
