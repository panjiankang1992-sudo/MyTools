spring:
  application:
    name: task-executor-service
executor:
  node-name: ${TASK_EXECUTOR_NODE_NAME:executor-local}
  scheduler-url: ${TASK_SCHEDULER_URL:http://127.0.0.1:23210}
  work-root: ${TASK_EXECUTOR_WORK_ROOT:./runtime/tasks}
  script-root: ${TASK_EXECUTOR_SCRIPT_ROOT:./scripts}
  heartbeat-seconds: ${TASK_EXECUTOR_HEARTBEAT_SECONDS:10}
  poll-seconds: ${TASK_EXECUTOR_POLL_SECONDS:1}
  lease-seconds: ${TASK_EXECUTOR_LEASE_SECONDS:60}
  max-concurrent-tasks: ${TASK_EXECUTOR_MAX_CONCURRENT_TASKS:4}
  capabilities:
    runtimes:
      - shell
      - python3.12
  labels: {}
  cluster-names:
    - media
    - reader
  script-environments:
    reader_source_search:
      READER_RUNTIME_BASE_URL: ${READER_RUNTIME_BASE_URL:http://127.0.0.1:23120}
      READER_RUNTIME_SECURE_KEY: ${READER_RUNTIME_SECURE_KEY:}
server:
  port: ${TASK_EXECUTOR_MANAGEMENT_PORT:23211}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
