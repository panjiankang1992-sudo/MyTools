server:
  address: ${MESSAGE_AUTOMATION_HTTP_HOST:127.0.0.1}
  port: ${MESSAGE_AUTOMATION_HTTP_PORT:23260}

spring:
  application:
    name: message-automation-service
  task:
    scheduling:
      pool:
        size: ${MESSAGE_AUTOMATION_SCHEDULING_POOL_SIZE:4}
      thread-name-prefix: message-automation-scheduler-
  datasource:
    url: jdbc:mysql://${MESSAGE_AUTOMATION_DB_HOST:127.0.0.1}:${MESSAGE_AUTOMATION_DB_PORT:3306}/${MESSAGE_AUTOMATION_DB_NAME:mytools_message_automation}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MESSAGE_AUTOMATION_DB_USER:}
    password: ${MESSAGE_AUTOMATION_DB_PASSWORD:}
  flyway:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

automation:
  internal-token: ${MESSAGE_AUTOMATION_INTERNAL_TOKEN:}
  messaging-url: ${MESSAGING_SERVICE_URL:http://127.0.0.1:23250}
  messaging-token: ${MESSAGING_INTERNAL_TOKEN:}
  download-url: ${DOWNLOAD_INGESTION_URL:http://127.0.0.1:23220}
  download-token: ${DOWNLOAD_INTERNAL_TOKEN:}
  completion-relay-enabled: ${MESSAGE_AUTOMATION_COMPLETION_RELAY_ENABLED:true}
  completion-relay-batch-size: ${MESSAGE_AUTOMATION_COMPLETION_RELAY_BATCH_SIZE:50}
  completion-relay-max-attempts: ${MESSAGE_AUTOMATION_COMPLETION_RELAY_MAX_ATTEMPTS:10}
  completion-relay-delay-ms: ${MESSAGE_AUTOMATION_COMPLETION_RELAY_DELAY_MS:250}
  reconciliation-delay-ms: ${MESSAGE_AUTOMATION_RECONCILIATION_DELAY_MS:250}
  reconciliation-batch-size: ${MESSAGE_AUTOMATION_RECONCILIATION_BATCH_SIZE:100}
  reconciliation-concurrency: ${MESSAGE_AUTOMATION_RECONCILIATION_CONCURRENCY:4}
  reconciliation-lease-seconds: ${MESSAGE_AUTOMATION_RECONCILIATION_LEASE_SECONDS:180}
  reconciliation-max-attempts: ${MESSAGE_AUTOMATION_RECONCILIATION_MAX_ATTEMPTS:8}
  action-status-poll-delay-ms: ${MESSAGE_AUTOMATION_ACTION_STATUS_POLL_DELAY_MS:250}
  max-actions-per-message: ${MESSAGE_AUTOMATION_MAX_ACTIONS_PER_MESSAGE:500}
