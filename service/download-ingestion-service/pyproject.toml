[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mytools-download-ingestion"
version = "0.1.0"
description = "Download request lifecycle and task orchestration service"
requires-python = ">=3.12"
dependencies = [
  "gallery-dl>=1.29,<2",
  "PyMySQL>=1.1,<2",
]

[project.scripts]
mytools-download-ingestion = "mytools_download_ingestion.main:main"
mytools-download-mcp = "mytools_download_ingestion.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
