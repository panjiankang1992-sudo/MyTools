name: download_publish_text
version: 1.0.0
runtime: python3.12
entrypoint: scripts/main.py
capabilities:
  - storage_write
parameters:
  required:
    - downloadRequestId
    - itemId
    - fileName
    - content
result:
  schema: schemas/result.schema.json
limits:
  timeoutSeconds: 120
  maxOutputBytes: 65536
