name: download_http_asset
version: 1.0.0
runtime: python3.12
entrypoint: scripts/main.py
capabilities:
  - network_http
  - filesystem_write
parameters:
  required:
    - downloadRequestId
    - itemId
    - url
    - fileName
result:
  schema: schemas/result.schema.json
limits:
  timeoutSeconds: 1800
  maxOutputBytes: 1048576
