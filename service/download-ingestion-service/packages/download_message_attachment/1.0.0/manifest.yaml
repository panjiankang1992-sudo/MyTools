name: download_message_attachment
version: 1.0.0
runtime: python3.12
entrypoint: scripts/main.py
capabilities:
  - messaging_internal_stream
  - managed_file_publish
parameters:
  required:
    - downloadRequestId
    - attachmentJobId
    - itemId
    - fileName
    - maxBytes
result:
  schema: schemas/result.schema.json
limits:
  timeoutSeconds: 1800
