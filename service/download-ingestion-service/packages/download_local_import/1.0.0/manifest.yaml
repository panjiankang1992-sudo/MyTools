name: download_local_import
version: 1.0.0
runtime: python3.12
entrypoint: scripts/main.py
capabilities:
  - storage_read
  - storage_write
  - task_create
parameters:
  required:
    - downloadRequestId
    - sourceStorageUri
    - fileName
result:
  schema: schemas/result.schema.json
limits:
  timeoutSeconds: 21600
  maxOutputBytes: 65536
