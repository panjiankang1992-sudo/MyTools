[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mytools-msgservice-adapter"
version = "0.1.0"
description = "Default-off historical message migration adapter"
requires-python = ">=3.12"
dependencies = ["PyMySQL>=1.1,<2"]

[project.scripts]
mytools-msgservice-adapter = "mytools_msgservice_adapter.main:main"
mytools-msgservice-export = "mytools_msgservice_adapter.sqlite_exporter:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
