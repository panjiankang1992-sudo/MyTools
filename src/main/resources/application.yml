spring:
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 512MB
  task:
    scheduling:
      pool:
        size: 4
  application:
    name: mytools
  mail:
    host: smtp.qq.com
    port: 465
    username: ${QQ_MAIL_USERNAME:740578608@qq.com}
    password: ${QQ_MAIL_AUTH_CODE:}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
  profiles:
    active: dev
  datasource:
    dynamic:
      enabled: true
      primary: my_tools
      strict: false
      datasource:
        my_tools:
          url: jdbc:mysql://127.0.0.1:3306/my_tools?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
          username: root
          password: ${MYTOOLS_DB_PASSWORD:}
          driver-class-name: com.mysql.cj.jdbc.Driver
          hikari:
            maximum-pool-size: 20
            minimum-idle: 5
        sales_order:
          url: jdbc:mysql://127.0.0.1:3306/sales_order?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
          username: root
          password: ${SALES_ORDER_DB_PASSWORD:}
          driver-class-name: com.mysql.cj.jdbc.Driver
          hikari:
            maximum-pool-size: 30
            minimum-idle: 10

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.yuyutian.mytools.**.Model
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET:}
  access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:2592000000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000}

snowflake:
  datacenter-id: ${SNOWFLAKE_DATACENTER_ID:1}
  worker-id: ${SNOWFLAKE_WORKER_ID:1}
  enabled: true

password:
  salt: ${PASSWORD_SALT:}

mytools:
  encryption:
    key: ${MYTOOLS_ENCRYPTION_KEY:}
    previous-key: ${MYTOOLS_ENCRYPTION_PREVIOUS_KEY:}
  ebook:
    cover-cache-dir: ${MYTOOLS_EBOOK_COVER_CACHE_DIR:/opt/extend/resource/.mytools/ebook-covers}
    archive-cache-dir: ${MYTOOLS_EBOOK_ARCHIVE_CACHE_DIR:/opt/extend/resource/.mytools/ebook-archives}
    index-enabled: ${MYTOOLS_EBOOK_INDEX_ENABLED:true}
    index-batch-size: ${MYTOOLS_EBOOK_INDEX_BATCH_SIZE:50}
    index-delay-ms: ${MYTOOLS_EBOOK_INDEX_DELAY_MS:30000}
    index-initial-delay-ms: ${MYTOOLS_EBOOK_INDEX_INITIAL_DELAY_MS:15000}
  reader-runtime:
    enabled: ${READER_RUNTIME_ENABLED:false}
    base-url: ${READER_RUNTIME_BASE_URL:http://127.0.0.1:23120}
    secure-key: ${READER_RUNTIME_SECURE_KEY:}
    connect-timeout-seconds: ${READER_RUNTIME_CONNECT_TIMEOUT_SECONDS:3}
    request-timeout-seconds: ${READER_RUNTIME_REQUEST_TIMEOUT_SECONDS:25}
    search-concurrency: ${READER_RUNTIME_SEARCH_CONCURRENCY:20}
    chapter-cache-dir: ${READER_RUNTIME_CHAPTER_CACHE_DIR:/opt/extend/resource/.mytools/reader-chapters}
    chapter-cache-ttl-hours: ${READER_RUNTIME_CHAPTER_CACHE_TTL_HOURS:168}
    chapter-cache-max-entries: ${READER_RUNTIME_CHAPTER_CACHE_MAX_ENTRIES:20000}
  connectivity:
    instance-id: ${MYTOOLS_INSTANCE_ID:mytools-default}
    api-version: v1
    mdns-enabled: ${MYTOOLS_MDNS_ENABLED:true}

rclone:
  rc-url: ${RCLONE_RC_URL:http://127.0.0.1:5572}
  rc-user: ${RCLONE_RC_USER:}
  rc-password: ${RCLONE_RC_PASSWORD:}
  serve-url: ${RCLONE_SERVE_URL:http://127.0.0.1:5573}
  serve-user: ${RCLONE_SERVE_USER:${RCLONE_RC_USER:}}
  serve-password: ${RCLONE_SERVE_PASSWORD:${RCLONE_RC_PASSWORD:}}

media:
  big-video-threshold-bytes: ${MEDIA_BIG_VIDEO_THRESHOLD_BYTES:52428800}
  manual-package:
    scan-delay-ms: ${MEDIA_MANUAL_PACKAGE_SCAN_DELAY_MS:30000}
    initial-delay-ms: ${MEDIA_MANUAL_PACKAGE_INITIAL_DELAY_MS:45000}
  analysis:
    scan-delay-ms: ${MEDIA_ANALYSIS_SCAN_DELAY_MS:15000}
    initial-delay-ms: ${MEDIA_ANALYSIS_INITIAL_DELAY_MS:30000}

registration:
  mail:
    from: ${REGISTRATION_MAIL_FROM:${QQ_MAIL_USERNAME:740578608@qq.com}}
    dev-log-code: ${REGISTRATION_MAIL_DEV_LOG_CODE:false}

logging:
  path: logs
  max-size: 10MB
  max-history: 7
  total-size-cap: 100MB

server:
  port: 23110

# 打标签服务配置
tagging:
  service:
    url: http://127.0.0.1:11434
    model: huihui_ai/qwen3-vl-abliterated:4b

migration:
  tasks:
    scheduler-url: ${TASK_SCHEDULER_URL:http://127.0.0.1:23210}
    media-tags:
      enabled: ${MEDIA_TAG_SIDECAR_ENABLED:false}
      task-name: media_generate_tags
      policy-version: ${MEDIA_TAG_POLICY_VERSION:media-tags-v1}
      priority: ${MEDIA_TAG_TASK_PRIORITY:40}
      service-url: ${TAGGING_SERVICE_URL:http://127.0.0.1:11434}
      model: ${TAGGING_SERVICE_MODEL:huihui_ai/qwen3-vl-abliterated:4b}
    media-processing:
      enabled: ${MEDIA_PROCESSING_SIDECAR_ENABLED:false}
      priority: ${MEDIA_PROCESSING_TASK_PRIORITY:30}
      probe-version: ${MEDIA_PROBE_POLICY_VERSION:media-probe-v1}
      thumbnail-version: ${MEDIA_THUMBNAIL_POLICY_VERSION:media-thumbnail-v1}
      video-analysis-version: ${MEDIA_VIDEO_ANALYSIS_POLICY_VERSION:media-video-analysis-v1}
    reader-search:
      enabled: ${READER_SEARCH_SIDECAR_ENABLED:false}
      priority: ${READER_SEARCH_TASK_PRIORITY:40}
      policy-version: ${READER_SEARCH_POLICY_VERSION:reader-search-v2}

copilot:
  gateway:
    enabled: ${COPILOT_GATEWAY_ENABLED:false}
    provider-url: ${COPILOT_PROVIDER_URL:http://127.0.0.1:11434/v1/chat/completions}
    api-key: ${COPILOT_PROVIDER_API_KEY:}
    model: ${COPILOT_PROVIDER_MODEL:huihui_ai/qwen3-vl-abliterated:4b}

dsh:
  enabled: ${DSH_ENABLED:false}
  base-url: ${DSH_BASE_URL:http://127.0.0.1:3080}
  workspace-path: ${DSH_WORKSPACE_PATH:/home/pankang}
  agent-preset: ${DSH_AGENT_PRESET:standard}
  connect-timeout-seconds: ${DSH_CONNECT_TIMEOUT_SECONDS:5}
  request-timeout-seconds: ${DSH_REQUEST_TIMEOUT_SECONDS:30}

# 文件扫描配置
file:
  resource:
    mount-path: ${FILE_RESOURCE_MOUNT_PATH:}
    require-mount: ${FILE_RESOURCE_REQUIRE_MOUNT:false}
  directory-name-cleanup:
    # 模型按小批次返回严格ID映射，避免长输出导致漏项或重复项。
    model-batch-size: 8
  scan:
    path: /opt/extend/resource
    extensions: jpg,jpeg,png,gif,bmp,webp,mp4,avi,mov,wmv,mkv,flv,mp3,wav,flac,aac,ogg,m4a,txt,md,pdf,doc,docx,epub,mobi
    thumbnail-path: /opt/extend/resource/.thumbnails
    batch-size: 100

management:
  endpoint:
    health:
      group:
        resource:
          include: resourceStorage
          show-details: always
  endpoints:
    web:
      exposure:
        include: health,metrics
