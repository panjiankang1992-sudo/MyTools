spring:
  task:
    scheduling:
      pool:
        size: 4
  application:
    name: mytools
  datasource:
    dynamic:
      enabled: true
      primary: my_tools
      strict: false
      datasource:
        my_tools:
          url: jdbc:mysql://127.0.0.1:3306/my_tools?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
          username: root
          password: ${MYTOOLS_DB_PASSWORD:}
          driver-class-name: com.mysql.cj.jdbc.Driver
          hikari:
            maximum-pool-size: 20
            minimum-idle: 5
        sales_order:
          url: jdbc:mysql://127.0.0.1:3306/sales_order?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
          username: root
          password: ${SALES_ORDER_DB_PASSWORD:}
          driver-class-name: com.mysql.cj.jdbc.Driver
          hikari:
            maximum-pool-size: 30
            minimum-idle: 10

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.yuyutian.mytools.**.Model
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET:}
  access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:2592000000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000}

snowflake:
  datacenter-id: ${SNOWFLAKE_DATACENTER_ID:1}
  worker-id: ${SNOWFLAKE_WORKER_ID:1}
  enabled: true

password:
  salt: ${PASSWORD_SALT:}

mytools:
  encryption:
    key: ${MYTOOLS_ENCRYPTION_KEY:}
    previous-key: ${MYTOOLS_ENCRYPTION_PREVIOUS_KEY:}

logging:
  path: logs
  max-size: 10MB
  max-history: 7
  total-size-cap: 100MB

server:
  port: 23110

# 打标签服务配置
tagging:
  service:
    url: http://127.0.0.1:11434
    model: huihui_ai/qwen3-vl-abliterated:4b

copilot:
  gateway:
    enabled: ${COPILOT_GATEWAY_ENABLED:false}
    provider-url: ${COPILOT_PROVIDER_URL:http://127.0.0.1:11434/v1/chat/completions}
    api-key: ${COPILOT_PROVIDER_API_KEY:}
    model: ${COPILOT_PROVIDER_MODEL:huihui_ai/qwen3-vl-abliterated:4b}

dsh:
  enabled: ${DSH_ENABLED:true}
  base-url: ${DSH_BASE_URL:http://127.0.0.1:3080}
  workspace-path: ${DSH_WORKSPACE_PATH:/home/pankang}
  agent-preset: ${DSH_AGENT_PRESET:standard}
  connect-timeout-seconds: ${DSH_CONNECT_TIMEOUT_SECONDS:3}
  request-timeout-seconds: ${DSH_REQUEST_TIMEOUT_SECONDS:30}

alist:
  internal-url: http://127.0.0.1:5244
  public-url: https://alist.yuyutian.top

# 文件扫描配置
file:
  scan:
    path: /opt/extend/resource
    extensions: jpg,jpeg,png,gif,bmp,webp,mp4,avi,mov,wmv,mkv,flv,mp3,wav,flac,aac,ogg,m4a,txt,md,pdf,doc,docx,epub,mobi
    thumbnail-path: /opt/extend/resource/.thumbnails
    batch-size: 100
    watch-enabled: true
    watch-debounce-seconds: 3
  maintenance:
    trash-path: /opt/extend/resource/.trash/file-maintenance
    md5-fixed-delay-ms: 600000
    md5-initial-delay-ms: 120000
